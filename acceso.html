  const PLAT_ALIASES={netflixpremium:"netflix",vip:"vipnetflix",netflixpremiumvip:"vipnetflix",disneypremium:"disneyp",disneystandard:"disneys",disneystandardsinespn:"disneys",disney:"disneyp",hbo:"hbomax",max:"hbomax",prime:"primevideo",paramountplus:"paramount",universalp:"universal",apple:"appletv",win10:"windows10",win11:"windows11",adobe:"adobeexpress",esetnod32:"eset",stella:"stellatv"};

  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function platKey(v){
    const k=String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    return PLAT_ALIASES[k]||k;
  }
  function platVisual(v){
    const k=platKey(v);
    if(k.startsWith("stellatv"))return PLAT_VISUALS.stellatv;
    if(k.startsWith("oleada"))return PLAT_VISUALS.oleada;
    if(k.startsWith("latintv"))return PLAT_VISUALS.latintv;
    if(k.startsWith("liontv"))return PLAT_VISUALS.liontv;
    if(k.startsWith("iptv"))return PLAT_VISUALS.iptv;
    return PLAT_VISUALS[k]||{logo:"",bg:"#111827",fallback:"TV"};
  }
  function platLogo(v,label){
    const visual=platVisual(v);
    const style=`--plat-bg:${visual.bg||"#111827"};--plat-color:${visual.color||"#fff"}`;
    const logo=visual.logo?`<img class="plat-logo" src="${visual.logo}" alt="Logo ${esc(label||"plataforma")}" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false">`:"";
    return `<div class="plat-icon" style="${style}">${logo}<span class="plat-fallback" ${visual.logo?"hidden":""}>${esc(visual.fallback||"TV")}</span></div>`;

  function supportData(d){
    const phone=String(d.vendedorTelefono||"").replace(/\D/g,"");
    const intl=phone?(phone.startsWith("504")?phone:`504${phone}`):"";
    return {phone,href:intl?`https://wa.me/${intl}`:"#"};
  }

  function fechaPartes(value){
    const s=String(value||"").trim();
    let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return {y:Number(m[3]),m:Number(m[2]),d:Number(m[1])};
    m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m)return {y:Number(m[1]),m:Number(m[2]),d:Number(m[3])};
    return null;
  }
  function hoyHondurasUTC(){
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Tegucigalpa",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const n=tipo=>Number(parts.find(p=>p.type===tipo)?.value||0);
    return Date.UTC(n("year"),n("month")-1,n("day"));
  }
  function estadoServicio(d){
    const fecha=fechaPartes(d.fechaRenovacion);
    const dias=fecha?Math.round((Date.UTC(fecha.y,fecha.m-1,fecha.d)-hoyHondurasUTC())/86400000):9999;
    if(d.vencido||dias<0)return {kind:"expired",label:"Vencido",dateLabel:"Venció"};
    if(dias<=3)return {kind:"soon",label:"Vence pronto",dateLabel:"Vence"};
    return {kind:"active",label:"Activo",dateLabel:"Vence"};
  }
  function nombrePlataforma(d){
    return String(d.plataformaLabel||"Servicio").replace(/^\s*⭐\s*/,"").trim()||"Servicio";
  }
  function tituloPlataforma(d){
    const nombre=nombrePlataforma(d);
    const largo=nombre.length;
    const size=largo>25?"clamp(11.5px,3vw,15px)":(largo>20?"clamp(12px,3.4vw,16px)":(largo>16?"clamp(13px,3.7vw,18px)":"18px"));
    const estrella=platKey(d.plataforma)==="vipnetflix"?`<span class="plat-star" aria-hidden="true">⭐</span>`:"";
    const apple=platKey(d.plataforma)==="appletv"?`<span class="plat-star" aria-hidden="true">🍎</span>`:"";
    const stella=platKey(d.plataforma).startsWith("stellatv")?`<span class="plat-star" aria-hidden="true">🔥</span>`:"";
    return `<div class="plat-name" style="--plat-name-size:${size}">${estrella}${apple}${stella}<span class="plat-title">${esc(nombre)}</span></div>`;
  }

  function nombreAcceso(d){
    const principal=perfilesDelServicio(d)[0]||{};
    return String(principal.perfil||principal.nombre||d.titular||"Acceso").trim()||"Acceso";
  }

  function copyToClipboard(text, btn){
    const doIt = async () => {
      try{ await navigator.clipboard.writeText(text); }
      catch(err){
        const ta=document.createElement("textarea");
        ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
      }
      showToast("¡Copiado!");
    };
    doIt();
  }
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1400);
  }

  function fieldRow(label, value, id){
    const key=String(label||"").toLowerCase();
    const icon=key.includes("correo")?"✉":key.includes("clave")?"🔒":key.includes("pin")?"#":key.includes("serial")||key.includes("licencia")?"🔐":"👤";
    return `<div class="field">
      <span class="field-icon" aria-hidden="true">${icon}</span>
      <button type="button" class="field-text copy-target" data-copy="${id}" aria-label="Copiar ${esc(label)}">
        <span class="field-label">${esc(label)}</span><span class="field-value" id="${id}">${esc(value)}</span><span class="field-copy-hint">Toque para copiar</span>
      </button>
      <button type="button" class="copy-btn copy-target" data-copy="${id}" aria-label="Copiar ${esc(label)}"><span class="copy-btn-icon" aria-hidden="true">⧉</span><span>Copiar</span></button>
    </div>`;
  }

  function infoRow(label,value,icon="👤"){
    return `<div class="field info-field">
      <span class="field-icon" aria-hidden="true">${esc(icon)}</span>
      <div class="field-static"><span class="field-label">${esc(label)}</span><span class="field-value">${esc(value)}</span></div>
    </div>`;
  }

  function perfilesDelServicio(d){
    if(Array.isArray(d.perfiles) && d.perfiles.length) return d.perfiles;
    return [{nombre:d.titular||"Cliente",perfil:d.perfil||"",correo:d.correo||"",clave:d.clave||"",pin:d.pin||"",usaPin:d.usaPin===true,modo:d.modo||""}];
  }

  function resumenDestinoPerfil(p,modo){
    const dispositivo=String(p&&p.dispositivo||"").toLowerCase();
    if(dispositivo==="cel"||(!dispositivo&&modo==="codigo")){
      return {icon:"📱",label:"Celular"};
    }
    if(dispositivo==="tv"||(!dispositivo&&modo==="perfil")){
      return {icon:"📺",label:p&&p.esRoku===true?"TV Roku":"TV"};
    }
    return {icon:"👤",label:"Acceso"};
  }

  function datosPerfilHtml(d, serviceIndex){
    const perfiles=perfilesDelServicio(d);
    const plataforma=platKey(d.plataforma);
    const etiquetaAcceso=["oleada","latintv","liontv","iptv","stella"].some(prefijo=>plataforma.startsWith(prefijo))?"Usuario":"Correo";
    const contenido=perfiles.map((p,profileIndex)=>{
      const prefix=`s${serviceIndex}-p${profileIndex}`;
      const modo=p.modo||d.modo;
      let campos="";
      const perfilAcceso=String(p.perfil||p.nombre||"").trim();
      const usaPin=p.usaPin===true||!!p.pin;
      const mostrarPerfil=!!perfilAcceso;
      if(mostrarPerfil&&perfilAcceso)campos+=infoRow("Perfil de acceso",perfilAcceso);
      if(modo==="serial"){
        if(p.clave)campos+=fieldRow("Serial / licencia",p.clave,`${prefix}-serial`);
      }else{
        if(p.correo)campos+=fieldRow(etiquetaAcceso,p.correo,`${prefix}-${etiquetaAcceso==="Usuario"?"usuario":"correo"}`);
        if(p.clave)campos+=fieldRow("Clave",p.clave,`${prefix}-clave`);
        if(usaPin)campos+=infoRow("PIN",p.pin||"—","#");
      }
      const nota=perfiles.length>1?notaModo(d,p):"";
      if(perfiles.length>1){
        const panelId=`detalle-perfil-${serviceIndex}-${profileIndex}`;
        const nombre=String(p.nombre||p.perfil||"Asignado").trim()||"Asignado";
        const destino=resumenDestinoPerfil(p,modo);
        const abierto=false;
        return `<section class="profile-accordion${abierto?" open":""}" data-profile-index="${profileIndex}">
          <button class="profile-trigger" type="button" aria-expanded="${abierto?"true":"false"}" aria-controls="${panelId}" aria-label="Abrir perfil ${profileIndex+1}: ${esc(nombre)}, ${esc(destino.label)}">
            <span class="profile-trigger-copy"><span class="profile-trigger-index">Perfil ${profileIndex+1}</span><span class="profile-trigger-name">${esc(nombre)}</span><span class="profile-trigger-device"><span aria-hidden="true">${destino.icon}</span>${esc(destino.label)}</span></span>
            <span class="profile-chevron" aria-hidden="true"></span>
          </button>
          <div class="profile-details" id="${panelId}"${abierto?"":" hidden"}><div class="profile-details-inner">${campos}${nota}</div></div>
        </section>`;
      }
      return `<div class="profile-group">${campos}</div>`;
    }).join("");
    return perfiles.length>1?`<div class="profiles-accordion-list">${contenido}</div>`:contenido;
  }

  function notaModo(d,perfil=null){
    const plat=platKey(d.plataforma);
    const modo=(perfil&&perfil.modo)||d.modo;
    if(plat==="vipnetflix") return `<div class="note"><b>📱 Pasos para ingresar en celular</b><br>1. Copie e ingrese el correo asignado.<br>2. Presione <b>Siguiente</b>.<br>3. Presione <b>Obtener ayuda</b>.<br>4. Copie y coloque la clave.<br>5. Presione <b>Iniciar sesión</b>.</div>`;
    if(modo==="serial") return `<div class="note"><b>🔐 Activación por licencia</b><br>Copie el serial exactamente como aparece y utilícelo en la pantalla de activación del producto.</div>`;
    if(modo==="pendiente") return `<div class="note"><b>⚙️ Acceso pendiente de configurar</b><br>Su vendedor debe confirmar si esta cuenta será utilizada en TV o celular antes de mostrar los datos correctos.</div>`;
    if(modo==="codigo"&&(plat==="disneyp"||plat==="disneys")) return `<div class="note"><b>📲 Pasos para ingresar en celular</b><br>1. Copie e ingrese el correo asignado en Disney+.<br>2. Cuando aparezca <b>Escribir contraseña</b>, toque:<br><b>¿Problemas para iniciar sesión? Enviar un código de acceso único</b><br>3. Solicite el código a su vendedor y escríbalo en Disney+.</div>`;
    if(modo==="codigo") return `<div class="note"><b>📲 Pasos para ingresar en celular</b><br>1. Copie e ingrese el correo asignado.<br>2. Presione <b>Siguiente</b>.<br>3. Presione <b>Iniciar sesión con código</b>.<br>4. Solicite el código a su vendedor cuando aparezca.</div>`;
    if(modo==="perfil") return `<div class="note">📺 La cuenta ya está vinculada al TV. Abra el perfil indicado e ingrese su PIN.</div>`;
    if(modo==="invite") return `<div class="note">📩 La invitación fue enviada a <b>su correo personal</b>. Revise también spam o promociones.</div>`;
    if(plat==="primevideo") return `<div class="note">📱 En celular ingrese con el correo y la clave mostrados. Si Prime Video solicita un <b>código de acceso</b>, pídalo a su vendedor.</div>`;
    return "";
  }

  function iconoCondicion(texto,index){
    const t=String(texto||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(t.includes("perfil"))return "👤";
    if(t.includes("dispositivo")||t.includes("pantalla"))return "📱";
    if(t.includes("honduras")||t.includes("conexion"))return "📍";
    if(t.includes("vpn"))return "🚫";
    if(t.includes("garantia"))return "🛡️";
    if(t.includes("correo"))return "✉️";
    if(t.includes("clave")||t.includes("contrasena")||t.includes("serial")||t.includes("licencia"))return "🔐";
    if(t.includes("compra")||t.includes("renta"))return "🛒";
    if(t.includes("descarga"))return "⬇️";
    if(t.includes("reprodu")||t.includes("musica"))return "▶️";
    return index%2===0?"✓":"•";
  }

    const perfiles=perfilesDelServicio(d);

      ? `<div class="netflix-code-alert" role="note"><b>⚠️ Aviso importante de Netflix</b>Es posible que en aproximadamente 15 días Netflix solicite un código temporal. Cuando le aparezca, comuníquese con su vendedor para recibirlo al instante.</div>`

      <div class="section-title">Condiciones del servicio</div>
      <div class="terms"><ul>${termsHtml}</ul></div>
      ${avisoCodigoNetflix}`;

  function tarjetaServicio(d,index,total,soporte=""){

          <span class="multi-meta"><span class="pill ${estado.kind}"><i></i>${estado.label}</span><span class="multi-date">📅 ${estado.dateLabel}: <b>${esc(d.fechaRenovacion||"—")}</b></span><span class="access-open-hint">Ver acceso</span></span>

  function activarAccesosMultiples(){
    const items=[...document.querySelectorAll('.multi-service')];
    items.forEach(item=>{
      const trigger=item.querySelector('.multi-trigger');
      const panel=item.querySelector('.multi-details');
      if(!trigger||!panel)return;
      trigger.addEventListener('click',()=>{
        const estabaAbierto=item.classList.contains('open');
        items.forEach(otro=>{
          const otroTrigger=otro.querySelector('.multi-trigger');
          const otroPanel=otro.querySelector('.multi-details');
          otro.classList.remove('open');
          if(otroTrigger)otroTrigger.setAttribute('aria-expanded','false');
          if(otroPanel)otroPanel.hidden=true;
        });
        if(!estabaAbierto){
          item.classList.add('open');
          trigger.setAttribute('aria-expanded','true');
          panel.hidden=false;
        }
      });
    });
  }

  function activarPerfilesMultiples(){
    document.querySelectorAll('.profiles-accordion-list').forEach(lista=>{
      const items=[...lista.children].filter(item=>item.classList.contains('profile-accordion'));
      items.forEach(item=>{
        const trigger=item.querySelector('.profile-trigger');
        const panel=item.querySelector('.profile-details');
        if(!trigger||!panel)return;
        trigger.addEventListener('click',()=>{
          const estabaAbierto=item.classList.contains('open');
          item.classList.toggle('open',!estabaAbierto);
          trigger.setAttribute('aria-expanded',estabaAbierto?'false':'true');
          panel.hidden=estabaAbierto;
        });
      });
    });
  }

      ${support.phone?`<a href="${support.href}" target="_blank" rel="noopener" class="cta">💬 Contactar soporte</a>
      <div class="renew-support-note"><b>🔄 Renovaciones y soporte</b><span>Para renovaciones y soporte, favor comunicarse directamente con este número, que fue el que le entregó su acceso.</span></div>`:""}
    </div>`;
  }

  function render(d){
    const servicios=Array.isArray(d.servicios)&&d.servicios.length?d.servicios:[d];
    const activos=servicios.filter(s=>estadoServicio(s).kind!=="expired").length;
    const primero=servicios.find(s=>!s.vencido)||servicios[0]||{};
    const multiple=servicios.length>1;
    const vendedores=[...new Set(servicios.map(s=>String(s.vendedor||"").trim().toLowerCase()).filter(Boolean))];
    const soportePorServicio=multiple&&vendedores.length>1;
    const soporte=soportePorServicio?"":bloqueSoporte(d.vendedor?d:(servicios[0]||d));
    const perfilesUnicos=!multiple?perfilesDelServicio(primero).length:0;
    const etiquetaConteo=multiple?`${servicios.length} ACCESO${servicios.length===1?"":"S"}`:(perfilesUnicos>1?`${perfilesUnicos} PERFILES`:"");
    // En las fichas con varios accesos, todos inician cerrados para que el
    // cliente vea primero la lista completa y elija cuál desea consultar.
    const primerAbierto=-1;
    const contenido=`<div class="multi-list${multiple?"":" single-access-list"}">${servicios.map((s,i)=>filaServicioMultiple({...s,_mostrarSoporte:soportePorServicio},i,servicios.length,false)).join("")}</div>${soporte}`;
    const fid=d.fidelidad||{},nivel=String(fid.nivel||'inicial'),nivelTexto=esc(fid.nivelNombre||'Inicial');
    const fidelidad=`<div class="fidelity-card level-${esc(nivel)}"><i>★</i><div><small>NIVEL DE FIDELIDAD</small><b>${nivelTexto}</b><span>${fid.siguiente?`${Number(fid.ciclos)||0} ciclos · faltan ${Number(fid.siguiente.faltan)||0} para ${esc(fid.siguiente.nombre)}`:'Nivel máximo alcanzado'}</span></div></div>`;
    const stageEl=document.getElementById('stage');
    stageEl.dataset.portalVendedor=String(d.vendedor||(vendedores.length===1?servicios[0]?.vendedor:"")||"");
    stageEl.innerHTML=`
      <div class="live-row"><span class="live-dot"></span><span class="live-label">${activos?"Acceso disponible":"Renovación pendiente"}</span>${etiquetaConteo?`<span class="multi-count">${etiquetaConteo}</span>`:""}</div>
      <h1 class="h1">¡Todo <span>listo!</span></h1>
      <div class="hello">Hola, ${esc(d.titular||"Cliente")}</div>
      <div class="sub">Su acceso ya está disponible. Guarde este enlace para consultar sus cuentas, promociones y premios cuando lo necesite.</div>
      ${fidelidad}
      <div class="access-list">${contenido}</div>
    `;
    activarAccesosMultiples();
    activarPerfilesMultiples();
    document.querySelectorAll('.copy-target').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const el=document.getElementById(btn.dataset.copy);
        if(el)copyToClipboard(el.textContent.trim(),btn);
      });
    });
  }

  function renderExpired(d){ render({...d,servicios:[{...d,vencido:true}]}); }

  function renderError(msg){
    document.getElementById('stage').innerHTML = `<div class="state"><b>No pudimos abrir este enlace</b>${esc(msg||"Contacte a su vendedor para que le reenvíe el acceso.")}</div>`;
  }

  (async function init(){
    const params = new URLSearchParams(window.location.search);
    let token = params.get('token');
    if (!token) {
      // Respaldo: si la reescritura de Vercel no agregó ?token=, se saca del
      // path directo (/c/{token}) para que el link funcione de todas formas.
      const m = window.location.pathname.match(/\/c\/([^/?#]+)/);
      if (m) token = decodeURIComponent(m[1]);
    }
    if (!token) { renderError("Falta el código del enlace."); return; }
    try{
      const resp = await fetch('/api/acceso?token=' + encodeURIComponent(token) + '&_=' + Date.now(), {cache:'no-store'});
      const data = await resp.json();
      if (data.vencido) { renderExpired(data); return; }
      if (!resp.ok || !data.ok) { renderError(data.error); return; }
      render(data);
    }catch(e){
      renderError("Hubo un problema de conexión. Intente de nuevo en un momento.");
    }
  })();
</script>
