name: Sublichat Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-v1-r13-limpio
    paths:
      - 'SUBLICUENTAS_ANDROID_SOURCE_1_0.zip'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: sublicuentas-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Sublichat 1.0 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare mobile source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SUBLICUENTAS_ANDROID_SOURCE_1_0.zip"
          test -f "$ZIP" || { echo "ERROR: falta $ZIP en la raíz del repositorio"; exit 1; }
          rm -rf mobile sublicuentas-android-bootstrap
          unzip -q "$ZIP"
          test -d sublicuentas-android-bootstrap || { echo 'ERROR: el ZIP no contiene sublicuentas-android-bootstrap/'; exit 1; }
          mv sublicuentas-android-bootstrap mobile
          test -f mobile/package.json || { echo 'ERROR: falta mobile/package.json'; exit 1; }
          test -f mobile/capacitor.config.json || { echo 'ERROR: falta mobile/capacitor.config.json'; exit 1; }

      - name: Install mobile dependencies (lockfile exacto)
        working-directory: mobile
        run: |
          test -f package-lock.json || { echo 'ERROR: falta mobile/package-lock.json (build reproducible)'; exit 1; }
          npm ci

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Build web bundle
        working-directory: mobile
        env:
          VITE_API_BASE_URL: https://sublichat.capuchino.lat
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Set Android debug build number
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("ERROR: falta android/app/build.gradle")
          run = os.environ["GITHUB_RUN_NUMBER"]
          text = path.read_text()
          text, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {run}", text, count=1)
          text, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "1.0-debug.{run}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("ERROR: no se pudo actualizar versionCode/versionName")
          path.write_text(text)
          print(f"Android debug versionCode={run}, versionName=1.0-debug.{run}")
          PYCODE

      - name: Restore stable debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: sublicuentas-android-debug-keystore-v1

      - name: Verify Android package
        working-directory: mobile
        run: |
          grep -R "com.sublicuentas.app" android/app/build.gradle* android/app/src/main/AndroidManifest.xml >/dev/null || {
            echo 'ERROR: no encontré com.sublicuentas.app';
            exit 1;
          }

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK package id
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "Package del APK: $PKG"
          test "$PKG" = "com.sublicuentas.app" || { echo "ERROR: package inesperado ($PKG)"; exit 1; }

      - name: Prepare artifact
        working-directory: mobile
        run: |
          mkdir -p artifacts
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "ERROR: no se generó $APK"; exit 1; }
          cp "$APK" artifacts/Sublichat-1.0-debug.apk
          sha256sum artifacts/Sublichat-1.0-debug.apk > artifacts/Sublichat-1.0-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sublichat-1.0-debug
          path: |
            mobile/artifacts/Sublichat-1.0-debug.apk
            mobile/artifacts/Sublichat-1.0-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Sublichat Android Debug'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Package: `com.sublicuentas.app`'
            echo "- Versión: `1.0` / debug build `${GITHUB_RUN_NUMBER}`"
            echo '- Artefacto: `Sublichat-1.0-debug.apk`'
          } >> "$GITHUB_STEP_SUMMARY"
