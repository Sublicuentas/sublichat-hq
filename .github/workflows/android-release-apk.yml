name: Sublichat Android Release APK

# R69/R80 · APK de producción FIRMADA (no debug). Requiere estos secretos del repositorio:
#   ANDROID_KEYSTORE_BASE64  (keystore .jks en base64)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# (Se crean una sola vez con el workflow "Sublichat · Generar llave de firma".)
# Se ejecuta a mano (Actions → Run workflow) o al subir una etiqueta android-v*.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nombre de versión visible (ej. 1.1.0)'
        required: true
        default: '1.1.0'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

concurrency:
  group: sublicuentas-android-release
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Build Sublichat Release APK (firmado)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check signing secrets
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do test -n "${!v}" || { echo "ERROR: falta el secreto de firma ($v). Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD."; exit 1; }; done

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare mobile source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SUBLICUENTAS_ANDROID_SOURCE_1_0.zip"
          test -f "$ZIP" || { echo "ERROR: falta $ZIP"; exit 1; }
          rm -rf mobile sublicuentas-android-bootstrap
          unzip -q "$ZIP"
          mv sublicuentas-android-bootstrap mobile
          test -f mobile/package-lock.json || { echo 'ERROR: falta mobile/package-lock.json'; exit 1; }

      - name: Install dependencies (npm ci)
        working-directory: mobile
        run: npm ci

      - name: Run tests
        working-directory: mobile
        run: npm test

      - name: Build web bundle
        working-directory: mobile
        env:
          VITE_API_BASE_URL: https://sublichat.capuchino.lat
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Create and sync Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Set versionCode / versionName (siempre creciente)
        working-directory: mobile
        shell: bash
        run: |
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle"); t = p.read_text()
          t, a = re.subn(r"versionCode\s+\d+", f"versionCode {os.environ['VERSION_CODE']}", t, count=1)
          name = os.environ['VERSION_NAME'].replace('android-v', '')
          t, b = re.subn(r'versionName\s+"[^"]+"', f'versionName "{name}"', t, count=1)
          if a != 1 or b != 1: raise SystemExit("ERROR: no se pudo fijar la versión")
          p.write_text(t); print("versionCode", os.environ['VERSION_CODE'], "versionName", name)
          PYCODE

      - name: Build unsigned release
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign, align and verify
        working-directory: mobile
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$IN" || { echo "ERROR: no se generó $IN"; exit 1; }
          mkdir -p artifacts
          "$BT/zipalign" -p -f 4 "$IN" artifacts/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KP --ks-key-alias "$KA" --key-pass env:KK --out "artifacts/Sublichat-${VERSION_CODE}-release.apk" artifacts/aligned.apk
          rm -f artifacts/aligned.apk "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --verbose "artifacts/Sublichat-${VERSION_CODE}-release.apk"
          PKG=$("$BT/aapt" dump badging "artifacts/Sublichat-${VERSION_CODE}-release.apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$PKG" = "com.sublicuentas.app" || { echo "ERROR: package inesperado ($PKG)"; exit 1; }
          if "$BT/aapt" dump badging "artifacts/Sublichat-${VERSION_CODE}-release.apk" | grep -q "application-debuggable"; then echo "ERROR: el APK de release es debuggable"; exit 1; fi
          sha256sum "artifacts/Sublichat-${VERSION_CODE}-release.apk" > "artifacts/Sublichat-${VERSION_CODE}-release.sha256"
          cat "artifacts/Sublichat-${VERSION_CODE}-release.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Sublichat-release-${{ github.run_number }}
          path: |
            mobile/artifacts/*.apk
            mobile/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 60

      - name: Summary
        if: always()
        run: |
          {
            echo '## Sublichat Android Release (firmado)'
            echo "- Package: \`com.sublicuentas.app\` · versionCode \`${VERSION_CODE}\` · versionName \`${VERSION_NAME}\`"
            echo '- Firmado con la llave de producción (apksigner verify OK) · SHA-256 adjunto'
          } >> "$GITHUB_STEP_SUMMARY"
